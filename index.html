
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL 隨機挑戰產生器</title>
<style>
:root{
  --gold:#d9b66d;--blue:#087fe8;--border:#244b70;
  --panel:rgba(4,19,35,.94);--text:#edf5ff;--muted:#a9bed5;
}
*{box-sizing:border-box}
body{margin:0;background:#06111f;color:var(--text);font-family:Arial,"Microsoft JhengHei",sans-serif}
button,select,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#backdrop{position:fixed;inset:0;z-index:-2;background:#071526 center/cover no-repeat;filter:brightness(.8)}
#backdrop:after{content:"";position:absolute;inset:0;background:rgba(2,10,22,var(--shade,.75))}
header{padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:rgba(2,12,25,.91);border-bottom:1px solid var(--gold)}
.brand{display:flex;align-items:center;gap:13px}
.logo{font-size:44px;color:var(--gold);text-shadow:0 0 18px #cba34e}
h1{font-size:clamp(19px,2.3vw,29px);margin:0}
.subtitle{font-size:12px;color:var(--muted);margin-top:5px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
select,.btn,input[type=file]{background:#102741;color:var(--text);border:1px solid #385d80;border-radius:7px;padding:9px}
input[type=range]{width:90px;accent-color:#70b9ff}
main{max-width:1650px;margin:auto;padding:18px;display:grid;grid-template-columns:255px minmax(0,1fr) 245px;gap:15px}
.panel,.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 5px 20px #0003}
.panel{padding:14px}
.panel h2,.section-title{font-size:17px;color:var(--gold);margin:0 0 14px}
.section{padding:11px;margin-bottom:11px;border:1px solid #244969;border-radius:9px;background:#0b2036b8}
.section h3{font-size:14px;margin:0 0 10px}
.btn{background:#0c2540;color:var(--text);border:1px solid #41678c;border-radius:7px;padding:9px 11px}
.btn:hover{background:#173b5d}
.btn.primary{background:#0878e8;border-color:#54a9ff;font-weight:700}
.btn.primary:hover{background:#208fff}
.full{width:100%;margin-top:8px}
.small{padding:6px 9px;font-size:12px}
.checks{display:grid;gap:10px}
.checks label{display:flex;align-items:center;gap:8px;font-size:14px}
input[type=checkbox]{accent-color:#1688f8;width:17px;height:17px}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.theme-btn{min-height:54px;color:var(--text);background:#102a44;border:1px solid var(--border);border-radius:7px}
.theme-btn.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.note,.muted{color:var(--muted);font-size:12px;line-height:1.6}
.range{margin-top:10px}
.range label{display:flex;justify-content:space-between;font-size:12px}
.range input{width:100%}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.topline h2{margin:0;font-size:21px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}
.summary-item{display:flex;align-items:center;gap:9px;padding:11px;min-width:0}
.summary-item img{width:48px;height:48px;object-fit:cover;border-radius:7px}
.summary-icon{font-size:30px;color:var(--gold)}
.summary-item small{display:block;color:var(--muted);font-size:11px}
.summary-item strong{display:block;overflow-wrap:anywhere;font-size:14px;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{padding:12px;min-width:0}
.card-title{display:flex;justify-content:space-between;gap:5px;color:var(--gold);font-size:16px;font-weight:bold;padding-bottom:9px;border-bottom:1px solid #39516a;margin-bottom:10px}
.splash{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:7px}
.hero-name{font-size:21px;margin:10px 0 3px}
.lane-symbol{font-size:72px;color:var(--gold);text-align:center;padding:24px 0 10px}
.center{text-align:center}
.spells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spell{text-align:center;min-width:0}
.spell img{width:min(72px,100%);aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid #b9a064}
.spell strong{display:block;font-size:13px;margin-top:7px;overflow-wrap:anywhere}
.actions{display:grid;gap:7px;margin-top:13px}
.actions button{width:100%}
.locked{border-color:var(--gold);box-shadow:inset 0 0 0 1px #d9b66d33}
.runes{margin-top:12px}
.rune-layout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.tree-head{display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:10px;font-weight:bold}
.tree-head img{width:37px;height:37px;object-fit:contain}
.rune-list{display:grid;gap:9px}
.rune-item{display:flex;align-items:center;gap:8px;font-size:13px}
.rune-item img{width:35px;height:35px;object-fit:contain;flex-shrink:0}
.rune-item small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.shards{border-left:1px solid var(--border);padding-left:12px}
.shard{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:12px}
.shard-icon{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;color:var(--gold);flex-shrink:0}
.rightbar{display:flex;flex-direction:column;gap:12px}
.rules{padding-left:19px;color:#c7d6e7;font-size:13px;line-height:1.9}
.status{font-size:12px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}
.status.ok{color:#83e0ae}.status.error{color:#ff9d9d}
footer{text-align:center;padding:18px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
#toast{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 17px;border:1px solid #5880a1;border-radius:9px;background:#102a44;z-index:10;max-width:90vw}
#loading{position:fixed;inset:0;background:#031020eF;z-index:20;display:grid;place-items:center;text-align:center;padding:20px}
.spinner{font-size:40px;color:var(--gold);animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1150px){
 main{grid-template-columns:225px minmax(0,1fr)}
 .rightbar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
 .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
 header{padding:12px}.controls{width:100%}.controls select{flex:1;min-width:115px}
 main{display:flex;flex-direction:column;padding:10px}
 .cards{grid-template-columns:1fr}
 .rune-layout{grid-template-columns:1fr 1fr}
 .shards{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);padding:12px 0 0}
 .rightbar{display:flex;flex-direction:column}
 .summary-item{padding:8px}.summary-item img{width:40px;height:40px}
}
</style>
</head>
<body>
<div id="backdrop"></div>
<header>
 <div class="brand"><div class="logo">◈</div><div>
  <h1 id="appTitle">LoL 隨機挑戰產生器</h1>
  <div class="subtitle" id="subtitle">隨機英雄・路線・符文・召喚師技能</div>
 </div></div>
 <div class="controls">
  <select id="lang" aria-label="Language">
   <option value="zh_TW">繁體中文</option><option value="zh_CN">简体中文</option>
   <option value="en_US">English</option><option value="ja_JP">日本語</option>
   <option value="ko_KR">한국어</option>
  </select>
  <select id="themeSelect" aria-label="Background"></select>
  <label title="背景亮度">☀ <input id="brightness" type="range" min="35" max="140" value="100"></label>
  <label title="背景遮罩">◐ <input id="shade" type="range" min="30" max="95" value="78"></label>
 </div>
</header>

<main>
 <aside class="panel">
  <h2 id="settingsTitle">⚙ 設定</h2>
  <section class="section">
   <h3 id="backgroundTitle">背景主題</h3>
   <div id="themeGrid" class="theme-grid"></div>
   <label class="btn full" style="display:block;text-align:center">
    <span id="uploadLabel">＋ 自訂背景圖片</span>
    <input id="file" type="file" accept="image/*" hidden>
   </label>
   <div class="range"><label><span id="brightnessLabel">背景亮度</span><span id="brightnessValue">100%</span></label></div>
   <div class="range"><label><span id="shadeLabel">遮罩強度</span><span id="shadeValue">78%</span></label></div>
  </section>
  <section class="section">
   <h3 id="rerollTitle">抽選項目</h3>
   <div class="checks" id="checks">
    <label><input type="checkbox" data-key="champion" checked><span data-t="champion">英雄</span></label>
    <label><input type="checkbox" data-key="lane" checked><span data-t="lane">路線</span></label>
    <label><input type="checkbox" data-key="runes" checked><span data-t="runes">符文</span></label>
    <label><input type="checkbox" data-key="spells" checked><span data-t="spells">召喚師技能</span></label>
   </div>
   <p class="note" id="selectionNote">只有勾選且未鎖定的項目會重抽。</p>
  </section>
  <button id="randomize" class="btn primary full">🎲 開始抽選</button>
  <button id="reset" class="btn full">↻ 重設結果</button>
 </aside>

 <section>
  <div class="topline"><h2 id="resultsTitle">🎲 你的隨機挑戰結果</h2>
   <button class="btn small" id="unlockAll">🔓 解除全部鎖定</button></div>
  <div id="summary" class="summary"></div>
  <div id="cards" class="cards"></div>
  <article id="runeCard" class="card runes"></article>
 </section>

 <aside class="rightbar">
  <section class="panel">
   <h2 id="dataTitle">▣ 遊戲資料來源</h2>
   <div id="dataStatus" class="status">等待載入遊戲資料…</div>
   <button id="reload" class="btn full">重新載入遊戲資料</button>
  </section>
  <section class="panel">
   <h2 id="rulesTitle">❔ 隨機規則</h2>
   <ol class="rules" id="rules"></ol>
  </section>
  <section class="panel">
   <h2 id="tipsTitle">💡 小提醒</h2>
   <p class="note" id="tips">遊戲資料由 Riot Data Dragon 提供。</p>
  </section>
 </aside>
</main>
<footer id="footer">LoL Random Challenge Generator · Riot Data Dragon</footer>
<div id="toast" role="status"></div>
<div id="loading"><div><div class="spinner">◈</div><h2 id="loadingTitle">正在載入遊戲資料…</h2><div class="status">Riot Data Dragon</div></div></div>

const DEFAULT={lang:"zh_TW",theme:"rift",custom:"",brightness:100,shade:78,
 selected:{champion:true,lane:true,runes:true,spells:true},
 locks:{champion:false,lane:false,runes:false,spells:false},
 results:{champion:null,lane:null,runes:null,spells:null}};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const x=JSON.parse(localStorage.getItem("lolchallenge"));return {...clone(DEFAULT),...x,selected:{...DEFAULT.selected,...x.selected},locks:{...DEFAULT.locks,...x.locks},results:{...DEFAULT.results,...x.results}}}catch{return clone(DEFAULT)}}
let state=loadState(),game=null,request=0,timer;
const t=()=>LANG[state.lang]||LANG.zh_TW;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick=a=>a?.length?a[Math.floor(Math.random()*a.length)]:null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem("lolchallenge",JSON.stringify(state))}catch{toast("Storage full. Background may not persist.")}}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(timer);timer=setTimeout(()=>$("toast").style.display="none",2800)}
function showLoading(v){$("loading").style.display=v?"grid":"none";document.querySelectorAll("button").forEach(b=>b.disabled=v)}
function status(s,cls=""){$("dataStatus").className="status "+cls;$("dataStatus").textContent=s}
function updateBackdrop(){
 const th=THEMES.find(x=>x.id===state.theme);
 const url=state.custom||(th&&th.url)||"";
 $("backdrop").style.backgroundImage=url?`url("${url}")`:"none";
 $("backdrop").style.backgroundColor=state.theme==="dark"?"#040914":"#10233a";
 $("backdrop").style.filter=`brightness(${state.brightness/100})`;
 $("backdrop").style.setProperty("--shade",state.shade/100);
 $("brightness").value=state.brightness;$("shade").value=state.shade;
 $("brightnessValue").textContent=state.brightness+"%";$("shadeValue").textContent=state.shade+"%";
}
const champion=id=>game?.champions.find(x=>x.id===id);
const spell=id=>game?.spells.find(x=>x.id===id);
const tree=id=>game?.treeMap[String(id)];
const rune=id=>game?.runeMap[String(id)];
const jungle=()=>state.results.lane==="jungle";
function randChampion(){return pick(game.champions)?.id}
function randLane(){
 let lanes=LANES;
 const spells=state.results.spells||[];
 const canChangeSpells=state.selected.spells&&!state.locks.spells;
 if(!canChangeSpells)lanes=LANES.filter(l=>spells.includes("SummonerSmite")?l==="jungle":l!=="jungle");
 return pick(lanes)||"middle";
}
function randSpells(){
 const other=game.spells.filter(s=>s.id!=="SummonerSmite");
 if(jungle()){const smite=spell("SummonerSmite");const second=pick(other);return smite&&second?[smite.id,second.id]:[]}
 return shuffle(other).slice(0,2).map(x=>x.id);
}
function randRunes(){
 const trees=game.trees,primary=pick(trees);
 if(!primary)return null;
 const secondary=pick(trees.filter(x=>x.id!==primary.id));
 if(!secondary)return null;
 const pr=[];
 for(const slot of primary.slots){const r=pick(slot.runes);if(r)pr.push(r.id)}
 const sec=[];
 for(let i=1;i<Math.min(4,secondary.slots.length);i++){const r=pick(secondary.slots[i].runes);if(r)sec.push(r.id)}
 const sr=shuffle(sec).slice(0,2);
 if(pr.length!==4||sr.length!==2)return null;
 return {primary:primary.id,secondary:secondary.id,pr,sr,shards:SHARDS.map(row=>pick(row)[0])};
}
function initializeResults(){
 const r=state.results;
 if(!r.lane)r.lane="middle";
 if(!champion(r.champion))r.champion=randChampion();
 if(!r.runes||!tree(r.runes.primary)||!tree(r.runes.secondary))r.runes=randRunes();
 if(!Array.isArray(r.spells)||r.spells.some(id=>!spell(id)))r.spells=randSpells();
 if(!state.locks.spells){
  const smite=r.spells.includes("SummonerSmite");
  if(jungle()&&!smite)r.spells=randSpells();
  if(!jungle()&&smite)r.spells=randSpells();
 }
}
function actions(key){return `<div class="actions"><button class="btn small" data-act="reroll" data-key="${key}">↻ ${esc(t().reroll)}</button><button class="btn small" data-act="lock" data-key="${key}">${state.locks[key]?"🔒 "+esc(t().unlock):"🔓 "+esc(t().lock)}</button></div>`}
function renderTree(id,ids,label){
 const tr=tree(id);if(!tr)return "";
 return `<div><div class="tree-head"><img src="https://ddragon.leagueoflegends.com/cdn/img/${esc(tr.icon)}" alt=""><span>${esc(label)}：${esc(tr.name)}</span></div><div class="rune-list">${ids.map(id=>{const r=rune(id);return r?`<div class="rune-item"><img src="https://ddragon.leagueoflegends.com/cdn/img/${esc(r.icon)}" alt=""><div>${esc(r.name)}<small>${esc((r.shortDesc||"").replace(/<[^>]*>/g," ").slice(0,75))}</small></div></div>`:""}).join("")}</div></div>`;
}
function render(){
 if(!game)return;
 const c=champion(state.results.champion),laneIndex=LANES.indexOf(state.results.lane),r=state.results.runes;
 const p=tree(r?.primary),s=tree(r?.secondary);
 $("summary").innerHTML=`
 <div class="panel summary-item">${c?`<img src="${cdn()}/img/champion/${esc(c.image.full)}" alt="">`:""}<div><small>${esc(t().champion)}</small><strong>${esc(c?.name||"—")}</strong></div></div>
 <div class="panel summary-item"><span class="summary-icon">⚔</span><div><small>${esc(t().lane)}</small><strong>${esc(t().lanes[laneIndex]||"—")}</strong></div></div>
 <div class="panel summary-item"><span class="summary-icon">✦</span><div><small>${esc(t().runes)}</small><strong>${esc(p?.name||"—")} / ${esc(s?.name||"—")}</strong></div></div>
 <div class="panel summary-item"><span class="summary-icon">✧</span><div><small>${esc(t().spells)}</small><strong>${esc((state.results.spells||[]).map(id=>spell(id)?.name||id).join(" + "))}</strong></div></div>`;
 $("cards").innerHTML=`
 <article class="card ${state.locks.champion?"locked":""}"><div class="card-title">✦ ${esc(t().champion)} ${state.locks.champion?"🔒":""}</div>${c?`<img class="splash" src="https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${esc(c.id)}_0.jpg" alt="${esc(c.name)}"><div class="hero-name">${esc(c.name)}</div><div class="muted">${esc(c.title)}</div>`:""}${actions("champion")}</article>
 <article class="card ${state.locks.lane?"locked":""}"><div class="card-title">⌖ ${esc(t().lane)} ${state.locks.lane?"🔒":""}</div><div class="lane-symbol">${["⇧","⚔","◇","⇩","♧"][laneIndex]||"◇"}</div><div class="center"><h2>${esc(t().lanes[laneIndex]||"—")}</h2><div class="muted">${jungle()?"Smite required":""}</div></div>${actions("lane")}</article>
 <article class="card ${state.locks.spells?"locked":""}"><div class="card-title">✧ ${esc(t().spells)} ${state.locks.spells?"🔒":""}</div><div class="spells">${(state.results.spells||[]).map(id=>{const x=spell(id);return x?`<div class="spell"><img src="${cdn()}/img/spell/${esc(x.image.full)}" alt=""><strong>${esc(x.name)}</strong><small class="muted">${esc((x.description||"").replace(/<[^>]*>/g," ").slice(0,65))}</small></div>`:""}).join("")}</div>${actions("spells")}</article>`;
 const shardText=(r?.shards||[]).map(id=>{
  const entry=SHARDS.flat().find(x=>x[0]===id);
  const key=entry?.[1]||"adaptive";
  return `<div class="shard"><span class="shard-icon">✦</span><span>${esc(t()[key])}</span></div>`;
 }).join("");
 $("runeCard").className="card runes "+(state.locks.runes?"locked":"");
 $("runeCard").innerHTML=`<div class="card-title">✧ ${esc(t().runes)} ${state.locks.runes?"🔒":""}</div><div class="rune-layout">${renderTree(r?.primary,r?.pr||[],t().primary)}${renderTree(r?.secondary,r?.sr||[],t().secondary)}<div class="shards"><strong>${esc(t().shards)}</strong>${shardText}</div></div>${actions("runes")}`;
 updateBackdrop();
}
function cdn(){return `https://ddragon.leagueoflegends.com/cdn/${game.version}`}
function renderLanguage(){
 const x=t();document.documentElement.lang=state.lang.replace("_","-");
 $("appTitle").textContent=x.title;$("subtitle").textContent=x.subtitle;
 $("settingsTitle").textContent=x.settings;$("backgroundTitle").textContent=x.background;
 $("uploadLabel").textContent=x.upload;$("brightnessLabel").textContent=x.brightness;$("shadeLabel").textContent=x.shade;
 $("rerollTitle").textContent=x.rerollTitle;$("selectionNote").textContent=x.selection;
 $("randomize").textContent=x.randomize;$("reset").textContent=x.reset;$("resultsTitle").textContent=x.results;
 $("unlockAll").textContent=x.unlockAll;$("dataTitle").textContent=x.data;$("reload").textContent=x.reload;
 $("rulesTitle").textContent=x.rulesTitle;$("tipsTitle").textContent=x.tipsTitle;$("tips").textContent=x.tips;
 $("loadingTitle").textContent=x.loading;
 document.querySelectorAll("[data-t]").forEach(el=>el.textContent=x[el.dataset.t]);
 $("rules").innerHTML=x.rules.map(rule=>`<li>${esc(rule)}</li>`).join("");
 $("themeSelect").innerHTML=THEMES.map((th,i)=>`<option value="${th.id}">${esc(x.themes[i])}</option>`).join("");
 $("themeGrid").innerHTML=THEMES.map((th,i)=>`<button class="theme-btn ${state.theme===th.id?"active":""}" data-theme="${th.id}">${["🌄","🌆","✨","🌑"][i]}<br>${esc(x.themes[i])}</button>`).join("");
 $("lang").value=state.lang;$("themeSelect").value=state.theme;
 updateBackdrop();if(game)render();
}
async function json(url){const r=await fetch(url);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function loadData(){
 const id=++request;showLoading(true);status(t().loading);
 try{
  const versions=await json("https://ddragon.leagueoflegends.com/api/versions.json");
  const version=versions[0],base=`https://ddragon.leagueoflegends.com/cdn/${version}/data/${state.lang}`;
  const [ch,ru,sp]=await Promise.all([json(base+"/champion.json"),json(base+"/runesReforged.json"),json(base+"/summoner.json")]);
  if(id!==request)return;
  const trees=ru,treeMap={},runeMap={};
  for(const tr of trees){treeMap[String(tr.id)]=tr;for(const slot of tr.slots||[])for(const r of slot.runes||[])runeMap[String(r.id)]=r}
  const spells=Object.values(sp.data).filter(x=>(x.modes||[]).includes("CLASSIC")).filter(x=>!["SummonerSnowball","SummonerPoroRecall","SummonerOdinGarrison","SummonerSiegeChampSelect1","SummonerSiegeChampSelect2"].includes(x.id));
  game={version,champions:Object.values(ch.data),trees,treeMap,runeMap,spells};
  initializeResults();renderLanguage();status(`${t().loaded} · ${version}`,"ok");save();
 }catch(err){if(id===request){console.error(err);status(`${t().failed} (${err.message})`,"error");toast(t().failed)}}
 finally{if(id===request)showLoading(false)}
}
function reroll(key){
 if(!game){toast(t().noData);return}
 if(state.locks[key]){toast(t().locked);return}
 if(key==="champion")state.results.champion=randChampion();
 if(key==="runes")state.results.runes=randRunes();
 if(key==="spells")state.results.spells=randSpells();
 if(key==="lane"){
  const next=randLane();
  if(!next){toast(t().conflict);return}
  state.results.lane=next;
 }
 save();render();
}
function randomize(){
 if(!game){toast(t().noData);return}
 const keys=["champion","lane","runes","spells"].filter(k=>state.selected[k]&&!state.locks[k]);
 if(!keys.length){toast(t().noSelection);return}
 // Preserve locked spell compatibility. If spells can change, lane may be chosen freely.
 if(keys.includes("lane"))state.results.lane=randLane();
 if(keys.includes("champion"))state.results.champion=randChampion();
 if(keys.includes("runes"))state.results.runes=randRunes();
 if(keys.includes("spells"))state.results.spells=randSpells();
 save();render();
}
$("lang").addEventListener("change",e=>{state.lang=e.target.value;save();renderLanguage();loadData()});
$("themeSelect").addEventListener("change",e=>{state.theme=e.target.value;state.custom="";save();renderLanguage()});
$("themeGrid").addEventListener("click",e=>{const b=e.target.closest("[data-theme]");if(!b)return;state.theme=b.dataset.theme;state.custom="";save();renderLanguage()});
$("brightness").addEventListener("input",e=>{state.brightness=+e.target.value;updateBackdrop();save()});
$("shade").addEventListener("input",e=>{state.shade=+e.target.value;updateBackdrop();save()});
$("file").addEventListener("change",e=>{
 const f=e.target.files?.[0];if(!f)return;
 if(!f.type.startsWith("image/")){toast("Please choose an image.");return}
 if(f.size>1500000){toast("Please choose an image smaller than 1.5 MB.");return}
 const rd=new FileReader();rd.onload=()=>{state.custom=String(rd.result);save();updateBackdrop();toast(t().upload)};
 rd.readAsDataURL(f);e.target.value="";
});
document.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("change",()=>{
 state.selected[el.dataset.key]=el.checked;save()
}));
$("randomize").addEventListener("click",randomize);
$("reload").addEventListener("click",loadData);
$("unlockAll").addEventListener("click",()=>{Object.keys(state.locks).forEach(k=>state.locks[k]=false);save();render()});
$("reset").addEventListener("click",()=>{
 if(!game)return;
 Object.keys(state.locks).forEach(k=>state.locks[k]=false);
 state.results={champion:randChampion(),lane:pick(LANES),runes:randRunes(),spells:null};
 state.results.spells=randSpells();save();render();
});
document.body.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const key=b.dataset.key;
 if(b.dataset.act==="lock"){state.locks[key]=!state.locks[key];save();render()}
 if(b.dataset.act==="reroll")reroll(key);
});
renderLanguage();loadData();
</script>
</body>
</html>
